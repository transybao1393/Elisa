# cargo-deny: the licence guard CI runs (.github/workflows/ci.yml, job "licenses") for both workspaces:
#   cargo deny --manifest-path elisa/Cargo.toml --locked check --config elisa/deny.toml licenses
#   cargo deny --manifest-path elisa/mem/Cargo.toml --locked check --config elisa/deny.toml licenses
# Elisa is MIT (../LICENSE), so every dependency must be under a permissive licence (a copyleft one would force its terms on Elisa). Anything not listed
# below fails the check, which includes GPL, LGPL and AGPL (evalexpr is pinned to 11.3.1, its last MIT release, because
# 12.x and later are AGPL-3.0). A dual licence like "MIT OR Apache-2.0" passes when one side is allowed.
# Before adding a licence here, check that it is permissive and record the crate in ../THIRD_PARTY_NOTICES.md.

[graph]
# what ships: macOS only (crates for other platforms, e.g. r-efi for UEFI, are not part of the build)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = true

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

# elisa and elisa-mem themselves (publish = false, MIT)
[licenses.private]
ignore = true
