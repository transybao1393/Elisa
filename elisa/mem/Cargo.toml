[package]
name = "elisa-mem"
version = "0.1.0"
edition = "2021"
description = "Disk-only graph memory store for Elisa (prototype)"

# standalone: not part of Elisa's package
[workspace]

[dependencies]
lz4_flex = "0.11"
crc32fast = "1"
libc = "0.2"

[profile.release]
opt-level = 3

# CI runs `cargo clippy --all-targets --locked -- -D warnings`. Style lints allowed, same policy as engine/Cargo.toml
# (prototype code; no finding is a bug): `x % n != 0` checks, map_or(false, ..), long tuple types, many-arg
# builders, and `add`/`next`-named methods that are not the std traits.
[lints.clippy]
manual_is_multiple_of = "allow"
unnecessary_map_or = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
should_implement_trait = "allow"
