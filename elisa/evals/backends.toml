# elisa eval · backends: Elisa against each backend's protocol (a scripted model speaking it, with its detection
# endpoints: src/eval_fake.rs). Each case: detection (the /model lines), then one tool turn read -> answer. Cloud APIs are
# told apart by host, so their dialects are covered by the protocol replicas in tests/fake_server.rs instead.
suite = "backends"
kind = "fake"

[[case]]
id = "backends.ollama"
description = "Ollama: detected, and a tool turn (read, then the answer) works in its protocol"
backend = "ollama"
max_ctx = 8192
approve = "yes"
[[case.files]]
path = "notes.txt"
content = "The launch code is 7341."
[[case.script]]
tool = { name = "read", input = { path = "notes.txt" } }
[[case.script]]
text = "The file says the launch code is 7341."
[[case.turns]]
send = "/model"
[[case.turns]]
send = "read notes.txt and tell me the code"
[[case.checks]]
type = "info_contains"
text = "backend: Ollama"
[[case.checks]]
type = "info_contains"
text = "Ollama: native API, window 8192"
[[case.checks]]
type = "tool_called"
name = "read"
[[case.checks]]
type = "tool_result_contains"
tool = "read"
text = "7341"
[[case.checks]]
type = "reply_contains"
text = "7341"
[[case.checks]]
type = "request_contains"
text = '"num_ctx":8192'

