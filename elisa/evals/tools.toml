# elisa eval · tools: Elisa's own tools, approvals and prechecks with a scripted model. Format: README "elisa eval".
suite = "tools"
kind = "fake"

[[case]]
id = "tools.edit_precheck"
description = "an edit that cannot change anything and a write to a URL fail before any approval box (QA longrun M1, security B2)"
approve = "yes"
[[case.files]]
path = "calc.py"
content = "x = 1\n"
[[case.script]]
tool = { name = "edit", input = { path = "calc.py", old = "x = 1", new = "x = 1" } }
[[case.script]]
tool = { name = "edit", input = { path = "calc.py", old = "y = 2", new = "y = 3" } }
[[case.script]]
tool = { name = "write", input = { path = "https://doc.rust-lang.org/std/index.html", content = "hi\n" } }
[[case.script]]
text = "nothing to do"
[[case.turns]]
send = "fix calc"
[[case.checks]]
type = "approvals"
max = 0
[[case.checks]]
type = "tool_result_contains"
name = "edit"
text = "no change"
[[case.checks]]
type = "tool_result_contains"
name = "edit"
text = "old not found"
[[case.checks]]
type = "tool_result_contains"
name = "write"
text = "is a URL"
[[case.checks]]
type = "file_unchanged"
path = "calc.py"
[[case.checks]]
type = "file_absent"
path = "https:"

[[case]]
id = "tools.approve_yes_no"
description = "yes runs the write; no denies the command and tells the model not to retry (QA chat 3a/3d)"
[[case.script]]
tool = { name = "write", input = { path = "new.txt", content = "hi\n" } }
[[case.script]]
text = "wrote it"
[[case.script]]
tool = { name = "bash", input = { command = "echo nope > x.txt" } }
[[case.script]]
text = "ok, not run"
[[case.turns]]
send = "make new.txt"
approvals = ["yes"]
[[case.turns]]
send = "now the bash"
approvals = ["no"]
[[case.checks]]
type = "file_contains"
path = "new.txt"
text = "hi"
[[case.checks]]
type = "file_absent"
path = "x.txt"
[[case.checks]]
type = "tool_result_contains"
name = "bash"
text = "denied by user: the user said no, so NOTHING was done"
[[case.checks]]
type = "audit_has"
event = "denial"
tool = "bash"

[[case]]
id = "tools.always_allow"
description = "always is saved in .elisa/allow and the next write does not ask"
[[case.script]]
tool = { name = "write", input = { path = "one.txt", content = "1\n" } }
[[case.script]]
text = "done"
[[case.script]]
tool = { name = "write", input = { path = "two.txt", content = "2\n" } }
[[case.script]]
text = "done"
[[case.turns]]
send = "write one.txt"
approvals = ["always"]
[[case.turns]]
send = "write two.txt"
[[case.checks]]
type = "approvals"
max = 1
[[case.checks]]
type = "file_contains"
path = ".elisa/allow"
text = "write"
[[case.checks]]
type = "file_contains"
path = "two.txt"
text = "2"

[[case]]
id = "tools.outside_read_asks"
description = "a read outside the project folder asks (read never asks inside) and a no keeps it out (QA files 1e)"
approve = "yes"
[[case.files]]
path = "inside.txt"
content = "inside\n"
[[case.script]]
tool = { name = "read", input = { path = "inside.txt" } }
[[case.script]]
tool = { name = "read", input = { path = "{{outside}}/private.txt" } }
[[case.script]]
text = "I could not read it."
[[case.turns]]
send = "read inside.txt and then {{outside}}/private.txt"
approvals = ["no"]
[[case.checks]]
type = "event"
event = "approve"
text = "\"outside\":true"
[[case.checks]]
type = "approvals"
max = 1
[[case.checks]]
type = "tool_result_contains"
name = "read"
text = "denied"

[[case]]
id = "tools.parse_guard"
description = "an edit that would add a syntax error to a Python file is refused; nothing is written"
approve = "yes"
config = "checks = false\n"
[[case.files]]
path = "calc.py"
content = "def add(a, b):\n    return a + b\n"
[[case.script]]
tool = { name = "edit", input = { path = "calc.py", old = "return a + b", new = "return (a + b" } }
[[case.script]]
text = "Fixed."
[[case.turns]]
send = "tweak add in calc.py"
[[case.checks]]
type = "tool_result_contains"
name = "edit"
text = "refused"
[[case.checks]]
type = "file_unchanged"
path = "calc.py"

[[case]]
id = "tools.check_before_done"
description = "after an edit the project's check runs; a failure goes back to the model, the fix passes"
approve = "yes"
[[case.files]]
path = ".elisa/checks.toml"
content = "commands = [\"sh check.sh\"]\n"
[[case.files]]
path = "check.sh"
content = "grep -q GOOD main.txt && exit 0\necho \"main.txt:1:1: error: main.txt is $(cat main.txt)\"\nexit 1\n"
[[case.script]]
tool = { name = "write", input = { path = "main.txt", content = "BAD\n" } }
[[case.script]]
text = "done"
[[case.script]]
tool = { name = "write", input = { path = "main.txt", content = "GOOD\n" } }
[[case.script]]
text = "fixed"
[[case.turns]]
send = "make main.txt"
[[case.checks]]
type = "event"
event = "check"
text = "\"status\":\"fail\""
[[case.checks]]
type = "event"
event = "check"
text = "\"status\":\"pass\""
[[case.checks]]
type = "file_contains"
path = "main.txt"
text = "GOOD"
[[case.checks]]
type = "reply_contains"
text = "fixed"

[[case]]
id = "tools.docs_sheet_default_name"
description = "docs_sheet with a made-up sheet \"Sheet1\" on a CSV still reads it (QA files M2); docs tools only on a document turn"
approve = "yes"
[[case.files]]
path = "leads.csv"
content = "name,city\nAda,London\nLin,Taipei\n"
[[case.script]]
tool = { name = "docs_sheet", input = { path = "leads.csv", sheet = "Sheet1" } }
[[case.script]]
text = "Two leads: Ada in London and Lin in Taipei."
[[case.turns]]
send = "what's in the spreadsheet leads.csv?"
[[case.checks]]
type = "tool_result_contains"
name = "docs_sheet"
text = "Taipei"
[[case.checks]]
type = "tools_offered"
prefix = "docs_"
[[case.checks]]
type = "approval_for"
tool = "docs_sheet"

[[case]]
id = "tools.route_chat_no_tools"
description = "intent routing (route = \"auto\"): plain chat turns carry no tool definitions at all"
[[case.script]]
text = "Hey! What can I do for you?"
[[case.script]]
text = "Why don't scientists trust atoms? They make up everything."
[[case.script]]
text = "Paris."
[[case.turns]]
send = "hey"
[[case.turns]]
send = "tell me a joke"
[[case.turns]]
send = "what's the capital of France"
[[case.checks]]
type = "no_tools_offered"
prefix = ""
[[case.checks]]
type = "reply_contains"
text = "Paris"

[[case]]
id = "tools.route_code_and_follow_up"
description = "a file / code turn carries the code tools (not the web ones); a follow-up keeps them; a thanks drops them"
approve = "yes"
[[case.files]]
path = "calc.py"
content = "def average(xs):\n    return sum(xs) / (len(xs) + 1)\n"
[[case.script]]
tool = { name = "read", input = { path = "calc.py" } }
[[case.script]]
text = "average divides by len + 1."
[[case.script]]
text = "Divide by len(xs) instead."
[[case.script]]
text = "You're welcome!"
[[case.turns]]
send = "read calc.py and tell me what's wrong"
[[case.turns]]
send = "it still gives the wrong average"
[[case.turns]]
send = "thanks!"
[[case.checks]]
type = "tools_offered"
prefix = "read"
turn = 1
[[case.checks]]
type = "tools_offered"
prefix = "edit"
turn = 1
[[case.checks]]
type = "tools_offered"
prefix = "bash"
turn = 1
[[case.checks]]
type = "no_tools_offered"
prefix = "web_"
turn = 1
[[case.checks]]
type = "tools_offered"
prefix = "edit"
turn = 2
[[case.checks]]
type = "no_tools_offered"
prefix = ""
turn = 3

[[case]]
id = "tools.route_widen_on_unoffered_tool"
description = "a call to a session tool the route left out widens the route and runs (after the usual approval), never a failed turn"
approve = "yes"
[[case.files]]
path = "notes.txt"
content = "buy oat milk\n"
[[case.script]]
tool = { name = "read", input = { path = "notes.txt" } }
[[case.script]]
text = "Your note says: buy oat milk."
[[case.turns]]
send = "what do my notes say?"
[[case.checks]]
type = "tool_result_contains"
name = "read"
text = "oat milk"
[[case.checks]]
type = "tools_offered"
prefix = "read"
[[case.checks]]
type = "reply_contains"
text = "oat milk"

[[case]]
id = "tools.attach_small_document_inline"
description = "a small attached document (a CSV outside the project) is copied into .elisa/uploads and its text goes into the turn whole: one model call, no tools"
[[case.home_files]]
path = "Downloads/sales.csv"
content = "region,amount\nnorth,120\nsouth,80\neast,45\n"
[[case.script]]
text = "The amount column adds up to 245."
[[case.turns]]
send = "what's the total of the amount column?"
attach = ["../home/Downloads/sales.csv"]
[[case.checks]]
type = "no_tools_offered"
prefix = ""
[[case.checks]]
type = "request_contains"
text = "[Attached: sales.csv, 4 rows]"
[[case.checks]]
type = "request_contains"
text = "south,80"
[[case.checks]]
type = "max_steps"
n = 1
[[case.checks]]
type = "reply_contains"
text = "245"

[[case]]
id = "tools.attach_large_document_overview"
description = "a large attached document with a vague request gets an overview inline (headings, first sentences, the full file's path): one model call, no tools, and a doc_info event with its fit"
max_ctx = 16384
[[case.home_files]]
path = "Downloads/guide.md"
content = "## Office rules\nEvery team member keeps the kitchen tidy and labels food in the fridge before the weekend clean-up starts.\nThe rest of this paragraph repeats so that the guide is long enough to need an overview instead of the whole text.\n\n"
repeat = 400
[[case.script]]
text = "It is an office guide about keeping the kitchen tidy."
[[case.turns]]
send = "read this one for me"
attach = ["../home/Downloads/guide.md"]
[[case.checks]]
type = "no_tools_offered"
prefix = ""
[[case.checks]]
type = "request_contains"
text = "overview below, ask about any part for detail]"
[[case.checks]]
type = "request_contains"
text = "The full file is saved at .elisa/uploads/"
[[case.checks]]
type = "max_steps"
n = 1
[[case.checks]]
type = "event"
event = "doc_info"
text = "fits as overview"

[[case]]
id = "tools.attach_refusal_retried"
description = "a reply saying it cannot read the attached document is replaced: the turn is asked once more with the text and a line saying it is right there"
max_ctx = 16384
[[case.home_files]]
path = "Downloads/guide.md"
content = "## Office rules\nEvery team member keeps the kitchen tidy and labels food in the fridge before the weekend clean-up starts.\nThe rest of this paragraph repeats so that the guide is long enough to need an overview instead of the whole text.\n\n"
repeat = 400
[[case.script]]
text = "I'm sorry, but I can't process the file you've attached."
[[case.script]]
text = "It is an office guide about keeping the kitchen tidy."
[[case.turns]]
send = "summarise"
attach = ["../home/Downloads/guide.md"]
[[case.checks]]
type = "request_contains"
text = "answer from it directly"
[[case.checks]]
type = "reply_contains"
text = "kitchen tidy"
[[case.checks]]
type = "reply_not_contains"
text = "can't process"

[[case]]
id = "tools.attach_text_stays_out_of_history"
description = "an attached document's text goes into the request of the turn that needs it only: the history keeps the reference line, a later question about it gets its own pages, a new topic gets none"
max_ctx = 16384
[[case.home_files]]
path = "Downloads/guide.md"
content = "## Office rules\nEvery team member keeps the kitchen tidy and labels food in the fridge before the weekend clean-up starts.\nThe rest of this paragraph repeats so that the guide is long enough to need an overview instead of the whole text.\n\n## Parking\nParking permits are issued by the facilities desk on the ground floor.\n\n"
repeat = 300
[[case.script]]
text = "It is an office guide about the kitchen and parking."
[[case.script]]
text = "The facilities desk issues parking permits."
[[case.script]]
text = "Waves fold on the shore."
[[case.turns]]
send = "read this one for me"
attach = ["../home/Downloads/guide.md"]
[[case.turns]]
send = "who issues parking permits?"
[[case.turns]]
send = "write me a haiku about the sea"
[[case.checks]]
type = "request_contains"
text = "overview below"
turn = 1
[[case.checks]]
type = "request_contains"
text = "[Attached: guide.md,"
turn = 2
[[case.checks]]
type = "request_not_contains"
text = "overview below"
turn = 2
[[case.checks]]
type = "request_contains"
text = "picked for this question"
turn = 2
[[case.checks]]
type = "request_not_contains"
text = "picked for this question"
turn = 3
[[case.checks]]
type = "request_not_contains"
text = "labels food in the fridge"
turn = 3
