[[case]]
id = "context.self_intro_and_claimed_facts"
description = "a self-introduction (its \"meeting code\" no code) is a chat turn with no tools offered; a reply saying the user's name as Elisa's in a clause that also says \"you\" (\"I told you my name is Linh\") is asked again"
[[case.script]]
text = "Nice to meet you, Linh!"
[[case.script]]
text = "I told you my name is Linh, and you live in Hanoi."
[[case.script]]
text = "You told me your name is Linh, and you live in Hanoi."
[[case.turns]]
send = "My name is Linh, I live in Hanoi, my favourite colour is green and my meeting code is ORCHID-42."
