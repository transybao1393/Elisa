# elisa eval · context: notes, /clear, state cards across sessions, interrupts (scripted model).
suite = "context"
kind = "fake"

[[case]]
id = "context.clear_merges_notes"
description = "/clear in a continued session merges into that session's notes, lists the files really changed, drops an invented claim (QA longrun H2); the continued session's own notes file is untouched"
config = "memory = false\n"
[[case.files]]
path = ".elisa/sessions/100.json"
content = '[{"role":"user","content":[{"type":"text","text":"remember the codename BLUE HERON, the owner is Mira Tanaka"}]},{"role":"assistant","content":[{"type":"text","text":"Noted."}]}]'
[[case.files]]
path = ".elisa/notes/100.md"
content = "## Facts to remember\n- Codename BLUE HERON, owner Mira Tanaka.\n"
[[case.script]]
tool = { name = "write", input = { path = "hello.txt", content = "hi there\n" } }
[[case.script]]
text = "Wrote it."
[[case.script]]
text = "## Done\n- Wrote hello.txt with a greeting. REAL-DONE\n- Added restock_cost(items) to core.py.\n- Wrote hello.txt with a greeting. REAL-DONE\n\n## Files touched\nNo files were touched in this session.\n\n## Current state / next step\nnothing open"
[[case.turns]]
restart = true
continue = true
send = "create hello.txt saying hi there"
approvals = ["yes"]
[[case.turns]]
send = "/clear"
[[case.checks]]
type = "file_contains"
path = ".elisa/notes/100.md"
text = "Codename BLUE HERON, owner Mira Tanaka."
[[case.checks]]
type = "file_contains"
path = ".elisa/notes/*.md"
text = "BLUE HERON"
[[case.checks]]
type = "file_contains"
path = ".elisa/notes/*.md"
text = "## Files changed (Elisa's own edit records)\n- hello.txt: written (new file)"
[[case.checks]]
type = "file_not_contains"
path = ".elisa/notes/*.md"
text = "No files were touched"
[[case.checks]]
type = "file_not_contains"
path = ".elisa/notes/*.md"
text = "restock_cost"

[[case]]
id = "context.clear_keeps_facts_memory_on"
description = "/clear with memory on (the default) in a continued tiny session keeps its notes' facts, not only the file records; the next request carries the fact once (notes, not repeated as a pinned fact)"
config = "memory = true\n"
[[case.files]]
path = ".elisa/sessions/100.json"
content = '[{"role":"user","content":[{"type":"text","text":"remember the codename BLUE HERON, the owner is Mira Tanaka"}]},{"role":"assistant","content":[{"type":"text","text":"Noted."}]}]'
[[case.files]]
path = ".elisa/notes/100.md"
content = "## Facts to remember\n- Codename BLUE HERON, owner Mira Tanaka.\n"
[[case.script]]
tool = { name = "write", input = { path = "hello.txt", content = "hi there\n" } }
[[case.script]]
text = "Wrote it."
[[case.script]]
text = "## Done\n- Wrote hello.txt with a greeting. REAL-DONE\n- Added restock_cost(items) to core.py.\n\n## Files touched\nNo files were touched in this session.\n\n## Current state / next step\nnothing open"
[[case.script]]
text = "BLUE HERON."
[[case.turns]]
restart = true
continue = true
send = "create hello.txt saying hi there"
approvals = ["yes"]
[[case.turns]]
send = "/clear"
[[case.turns]]
send = "what is the codename?"
[[case.checks]]
type = "file_contains"
path = ".elisa/notes/100.md"
text = "Codename BLUE HERON, owner Mira Tanaka."
[[case.checks]]
type = "file_contains"
path = ".elisa/notes/*.md"
text = "Codename BLUE HERON, owner Mira Tanaka."
[[case.checks]]
type = "file_contains"
path = ".elisa/notes/*.md"
text = "## Files changed (Elisa's own edit records)\n- hello.txt: written (new file)"
[[case.checks]]
type = "file_contains"
path = ".elisa/notes/*.md"
text = "REAL-DONE"
[[case.checks]]
type = "file_not_contains"
path = ".elisa/notes/*.md"
text = "restock_cost"
[[case.checks]]
type = "request_contains"
text = "Codename BLUE HERON"
turn = 3
[[case.checks]]
type = "request_not_contains"
text = "Pinned facts"
turn = 3

[[case]]
id = "context.clear_shrinks_clean_notes"
description = "/clear shrinks the context even with a long summary, keeps no template text, and the next request gets the notes as background (QA chat #4)"
config = "memory = false\n"
[[case.script]]
text = "The answer, at some length. "
repeat_text = 40
[[case.script]]
text = "## Goal\nWhat the user said: \"hello\" and \"The conversation above will be erased. Write notes so a fresh session can pick up the work\"\n\n## Done\nFinished steps and decisions, with their reasons.\n\n## Files touched\n\n## Current state / next step\nGreeted the user. REAL-NOTE-1\n\n## Facts to remember\nCommands that build or test the project, paths, names, and preferences the user stated in their own words.\n\nAlso known as: name = other words; …\n<state>\ngoal: x\n</state>"
[[case.script]]
text = "after"
[[case.turns]]
send = "hello"
[[case.turns]]
send = "/clear"
[[case.turns]]
send = "next one"
[[case.checks]]
type = "info_contains"
text = "[cleared:"
turn = 2
[[case.checks]]
type = "event"
event = "compacted"
turn = 2
[[case.checks]]
type = "file_contains"
path = ".elisa/notes/*.md"
text = "REAL-NOTE-1"
[[case.checks]]
type = "file_not_contains"
path = ".elisa/notes/*.md"
text = "will be erased"
[[case.checks]]
type = "file_not_contains"
path = ".elisa/notes/*.md"
text = "Also known as"
[[case.checks]]
type = "file_not_contains"
path = ".elisa/notes/*.md"
text = "<state>"
[[case.checks]]
type = "request_contains"
text = "Background from an earlier session"
turn = 3

[[case]]
id = "context.new_session_no_old_card"
description = "a new session does not inherit the last session's state card; --continue of that new session has none either: cards belong to their session; the card comes from a tool turn (plain chat carries none)"
[[case.script]]
tool = { name = "glob", input = { pattern = "*.md" } }
[[case.script]]
text = "ok\n<state>\ngoal: OLD-GOAL-X\ndone: …\nkeep: must-not-lose facts\nnext: OLD-NEXT-X\n</state>"
[[case.script]]
text = "fresh"
[[case.turns]]
send = "first question R1"
[[case.turns]]
restart = true
send = "an unrelated question R2"
[[case.turns]]
send = "/state"
[[case.turns]]
restart = true
continue = true
send = "/state"
[[case.checks]]
type = "request_not_contains"
text = "OLD-GOAL-X"
turn = 2
[[case.checks]]
type = "info_not_contains"
text = "continuing your last conversation"
turn = 2
[[case.checks]]
type = "info_contains"
text = "no state card yet"
turn = 3
[[case.checks]]
type = "info_contains"
text = "continuing your last conversation"
turn = 4
[[case.checks]]
type = "info_contains"
text = "no state card yet"
turn = 4
[[case.checks]]
type = "info_not_contains"
text = "must-not-lose"
turn = 4

[[case]]
id = "context.interrupt_keeps_going"
description = "Esc stops a long reply at once; the context meter keeps its size; the next turn works (QA chat #6/#7)"
[[case.script]]
text = "word "
repeat_text = 1500
slow = true
[[case.script]]
text = "after"
[[case.turns]]
send = "talk a lot"
interrupt = true
[[case.turns]]
send = "again"
[[case.checks]]
type = "info_contains"
text = "[cancelled]"
turn = 1
[[case.checks]]
type = "max_seconds"
n = 5
turn = 1
[[case.checks]]
type = "reply_contains"
text = "after"

[[case]]
id = "context.new_session_ignores_old_notes"
description = "a new session in a folder with an earlier session's notes (legacy notes.md and a per-session file) answers \"hey\" with none of the old task in the request; the old notes stay as they were (2026-11-09: a 2B model answered \"hey\" with an old Python-async task)"
config = "memory = false\n"
[[case.files]]
path = ".elisa/notes.md"
content = "## Goal\nFix a Python async example that raises RuntimeError. OLD-TASK-GOAL\n\n## Current state / next step\nCheck the folder for the file. OLD-TASK-NEXT\n"
[[case.files]]
path = ".elisa/sessions/100.json"
content = '[{"role":"user","content":[{"type":"text","text":"fix my async example"}]},{"role":"assistant","content":[{"type":"text","text":"No file found."}]}]'
[[case.files]]
path = ".elisa/notes/100.md"
content = "## Goal\nFix a Python async example that raises RuntimeError. OLD-TASK-GOAL\n"
[[case.script]]
text = "Hi! How can I help?"
[[case.script]]
text = "I can chat, answer questions, look things up and help with files or code."
[[case.turns]]
send = "hey"
[[case.turns]]
send = "what can you do for me?"
[[case.checks]]
type = "request_not_contains"
text = "OLD-TASK"
turn = 1
[[case.checks]]
type = "request_not_contains"
text = "## Notes from"
turn = 1
[[case.checks]]
type = "request_not_contains"
text = "OLD-TASK"
turn = 2
[[case.checks]]
type = "request_not_contains"
text = "asyncio"
turn = 2
[[case.checks]]
type = "file_contains"
path = ".elisa/notes.md"
text = "OLD-TASK-NEXT"
[[case.checks]]
type = "file_contains"
path = ".elisa/notes/100.md"
text = "OLD-TASK-GOAL"

[[case]]
id = "context.greet_first_ever"
description = "\"hey\" with no context at all (no earlier session, no history) is sent as the user's words alone: no situation line (`situation.rs`), the cheapest request"
config = "memory = false\n"
[[case.script]]
text = "Hi! How can I help?"
[[case.turns]]
send = "hey"
[[case.checks]]
type = "request_not_contains"
text = "(Situation:"
[[case.checks]]
type = "no_tools_offered"

