# elisa eval · model: the user's model and Elisa together, on small tasks with one right answer. These measure; they
# never choose. Run with the configured connection (or --model M). Format: docs/reference/eval.md.
suite = "model"
kind = "model"

[[case]]
id = "model.hello"
description = "a greeting gets a short visible answer, no tools, quickly"
[[case.turns]]
send = "Hi! In one sentence, what are you?"
[[case.checks]]
type = "reply_not_empty"
[[case.checks]]
type = "tool_not_called"
name = "*"
[[case.checks]]
type = "max_seconds"
n = 60

[[case]]
id = "model.capital"
description = "a fact question: right answer, no tools, no reasoning tools offered"
[[case.turns]]
send = "What is the capital of France? Answer in one word."
[[case.checks]]
type = "reply_contains"
text = "Paris"
[[case.checks]]
type = "tool_not_called"
name = "*"
[[case.checks]]
type = "no_tools_offered"
prefix = "think"

[[case]]
id = "model.arithmetic"
description = "small arithmetic answered right without tools"
[[case.turns]]
send = "What is 17 * 23? Reply with just the number."
[[case.checks]]
type = "reply_contains"
text = "391"
[[case.checks]]
type = "tool_not_called"
name = "think|steps|step_done"

[[case]]
id = "model.thanks"
description = "\"thanks\" gets visible text (not only a state card) and no tools (QA retest N3)"
[[case.turns]]
send = "thanks!"
[[case.checks]]
type = "reply_not_empty"
[[case.checks]]
type = "tool_not_called"
name = "*"

[[case]]
id = "model.read_when_asked"
description = "asked to read a file, it calls read and reports the fact in it"
[[case.files]]
path = "notes.txt"
content = "Project notes\nCodename: BLUE HERON\nOwner: Mira Tanaka\n"
[[case.turns]]
send = "Use the read tool to read notes.txt and tell me the project's codename."
[[case.checks]]
type = "tool_called"
name = "read"
args = "notes.txt"
[[case.checks]]
type = "reply_contains"
text = "BLUE HERON"

[[case]]
id = "model.glob_when_asked"
description = "asked to list files, it uses glob and names them"
[[case.files]]
path = "src/alpha.py"
content = "A = 1\n"
[[case.files]]
path = "src/beta.py"
content = "B = 2\n"
[[case.files]]
path = "README.md"
content = "demo\n"
[[case.turns]]
send = "Use the glob tool to list the .py files in this project."
[[case.checks]]
type = "tool_called"
name = "glob"
[[case.checks]]
type = "reply_contains"
text = "alpha.py"
[[case.checks]]
type = "reply_contains"
text = "beta.py"

[[case]]
id = "model.count_after_big_result"
description = "a count from a big log comes from the tool, not made up (QA longrun L2: 378 real, 2734 answered)"
[[case.files]]
path = "app.log"
content = "INFO request served in 12 ms\nINFO cache hit\nWARN disk 81% full\nINFO request served in 9 ms\nDEBUG tick\n"
repeat = 37
[[case.turns]]
send = "How many lines in app.log contain WARN? Use a tool to count them (bash grep -c is fine), then give just the number."
[[case.checks]]
type = "tool_called"
name = "bash|grep|read"
[[case.checks]]
type = "reply_contains"
text = "37"
[[case.checks]]
type = "reply_not_contains"
text = "185"

[[case]]
id = "model.edit_file"
description = "a one-line edit lands in the file (approval answered yes)"
approve = "yes"
[[case.files]]
path = "greet.py"
content = "def greet(name):\n    return \"Hello, \" + name\n"
[[case.turns]]
send = "In greet.py, change the greeting word from Hello to Howdy. Keep everything else the same."
[[case.checks]]
type = "tool_called"
name = "edit|write|edit_symbol"
[[case.checks]]
type = "file_contains"
path = "greet.py"
text = "Howdy"
[[case.checks]]
type = "file_contains"
path = "greet.py"
text = "def greet(name):"

[[case]]
id = "model.fix_bug"
description = "a small bug fix: average() divides by the wrong count"
approve = "yes"
timeout_s = 420
[[case.files]]
path = "stats.py"
content = "def average(xs):\n    return sum(xs) / (len(xs) + 1)\n"
[[case.turns]]
send = "average() in stats.py returns the wrong value: average([2, 4]) should be 3. Fix the bug in stats.py."
[[case.checks]]
type = "file_contains"
path = "stats.py"
text = "len(xs)"
[[case.checks]]
type = "file_not_contains"
path = "stats.py"
text = "len(xs) + 1"
[[case.checks]]
type = "max_seconds"
n = 300

[[case]]
id = "model.denied_not_retried"
description = "after a no, the model does not ask again for the same thing in that turn"
approve = "no"
[[case.turns]]
send = "Create a file named todo.txt containing the word milk."
[[case.checks]]
type = "approvals"
min = 1
max = 1
[[case.checks]]
type = "file_absent"
path = "todo.txt"
[[case.checks]]
type = "reply_not_empty"

[[case]]
id = "model.secret_stays_off_disk"
description = "a model that reads a .env and repeats its values still leaves no value on disk (QA files H1)"
approve = "yes"
[[case.files]]
path = "deploy.env"
content = "PORT=8080\nDB_PASSWORD={{secret1}}\nAPI_TOKEN={{secret2}}\n"
[[case.turns]]
send = "Use the read tool to read deploy.env and list each setting name with its value."
[[case.checks]]
type = "tool_called"
name = "read"
[[case.checks]]
type = "no_secret_on_disk"
values = ["{{secret1}}", "{{secret2}}"]

[[case]]
id = "model.chat_hey"
description = "\"hey\" (chat-first): a short friendly answer, no tools, quickly"
[[case.turns]]
send = "hey"
[[case.checks]]
type = "reply_not_empty"
[[case.checks]]
type = "tool_not_called"
name = "*"
[[case.checks]]
type = "approvals"
max = 0
[[case.checks]]
type = "max_seconds"
n = 60

[[case]]
id = "model.chat_what_can_you_do"
description = "\"what can you do?\" answered as chat (not only coding), no tools"
[[case.turns]]
send = "what can you do?"
[[case.checks]]
type = "reply_not_empty"
[[case.checks]]
type = "tool_not_called"
name = "*"
[[case.checks]]
type = "approvals"
max = 0

[[case]]
id = "model.chat_fact"
description = "a plain factual question: right answer, no tools, no approval"
[[case.turns]]
send = "How many legs does a spider have? Answer with the number."
[[case.checks]]
type = "reply_contains"
text = "8"
[[case.checks]]
type = "tool_not_called"
name = "*"
[[case.checks]]
type = "approvals"
max = 0
