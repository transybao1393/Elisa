[[case]]
id = "core.chat_follow_up_hints"
description = "short follow-ups after an answer get a one-line hint before the words (\"why?\", \"cái thứ hai\", \"and in Osaka?\"); none in a new session"
[[case.script]]
text = "1. Kyoto 2. Nara 3. Osaka"
[[case.script]]
text = "Nara có hươu và chùa cổ."
[[case.script]]
text = "Because they are close to each other."
[[case.script]]
text = "In Osaka: Dotonbori, the castle, Kuromon market."
[[case.script]]
text = "Why what?"
[[case.turns]]
send = "list 3 day trips from Tokyo, one line"
[[case.turns]]
send = "cái thứ hai"
[[case.turns]]
send = "why?"
[[case.turns]]
send = "and in Osaka?"
[[case.turns]]
send = "why?"
restart = true
[[case.checks]]
type = "request_not_contains"
text = "(Follow-up:"
turn = 1
[[case.checks]]
type = "request_contains"
text = "(Follow-up: the user picks item 2 from your last answer"
turn = 2
[[case.checks]]
type = "request_contains"
text = "(Follow-up: explain the reason behind your last answer. Don't repeat it.)\n\nwhy?"
turn = 3
[[case.checks]]
type = "request_contains"
text = "(Follow-up: same question as before, now about Osaka.)"
turn = 4
[[case.checks]]
type = "request_not_contains"
text = "(Follow-up:"
turn = 5
[[case.checks]]
type = "tool_not_called"
name = "*"

[[case]]
id = "core.chat_resume_on_ask"
description = "\"continue the last one\" in a new session loads the last session like --continue (its history goes in the request, an info line says so); a plain new session still carries nothing; a chat (no tools in its last turn) gets the recap-and-offer hint, not \"go on from your last answer\""
[[case.script]]
text = "Page 12 covers the budget."
[[case.script]]
text = "Noted: the code word is PELICAN-7."
[[case.script]]
text = "Hello!"
[[case.script]]
text = "Continuing: page 13 covers the timeline."
[[case.turns]]
send = "summarise page 12 of the report"
[[case.turns]]
send = "remember the code word PELICAN-7"
[[case.turns]]
send = "hello"
restart = true
[[case.turns]]
send = "continue the last one"
restart = true
[[case.checks]]
type = "request_not_contains"
text = "PELICAN-7"
turn = 3
[[case.checks]]
type = "request_contains"
text = "PELICAN-7"
turn = 4
[[case.checks]]
type = "request_contains"
text = "(Follow-up: the user is back after a break. Talking to them directly, tell them in 1-2 short sentences what this chat covered"
turn = 4
[[case.checks]]
type = "info_contains"
text = "[continued your last session: summarise page 12 of the report"
turn = 4
[[case.checks]]
type = "reply_contains"
text = "page 13"
turn = 4

[[case]]
id = "core.chat_continue_skips_dead_session"
description = "--continue skips a newer session that is only a continue ask answered with the intro; a follow-up after the intro gets no hint"
[[case.script]]
text = "Page 12 covers the budget, code word PELICAN-7."
[[case.script]]
text = "I'm Elisa, a personal assistant on your Mac. How can I help?"
[[case.script]]
text = "Hey! How can I help you today?"
[[case.script]]
text = "Page 13 covers the timeline."
[[case.turns]]
send = "summarise page 12 of the report"
[[case.turns]]
send = "hello there"
restart = true
[[case.turns]]
send = "more"
[[case.turns]]
send = "and page 13?"
restart = true
continue = true
[[case.checks]]
type = "request_not_contains"
text = "(Follow-up:"
turn = 3
[[case.checks]]
type = "request_contains"
text = "PELICAN-7"
turn = 4

[[case]]
id = "core.chat_resume_none"
