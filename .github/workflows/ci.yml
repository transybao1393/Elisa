# CI for Elisa: the Rust core (build, clippy, tests, the scripted eval), the two macOS apps, and a licence guard.
# macOS runners for the core and the apps: the core uses Seatbelt (sandbox-exec) and macOS-only code, the apps are
# SwiftUI/AppKit. Nothing here needs a model, Ollama, Colima, docker or network access beyond fetching crates;
# the tests that do are #[ignore]d.
# Actions are pinned to full commit SHAs (version in the comment); update them deliberately, not by tag drift.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# one run per branch or PR: a newer push cancels the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  core:
    name: core (Rust)
    runs-on: macos-26 # arm64
    timeout-minutes: 45
    defaults:
      run:
        working-directory: elisa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master, 2026-11)
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            elisa -> target
            elisa/mem -> target

      - name: Toolchain
        run: rustc --version && cargo --version && sw_vers

      # online and --locked: Cargo.lock must be current (app/ElisaApp/run.sh builds --offline for local use only)
      - name: Build
        run: cargo build --release --locked

      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Clippy (mem)
        working-directory: elisa/mem
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --release --locked --no-fail-fast

      - name: Test (mem)
        working-directory: elisa/mem
        run: cargo test --release --locked

      # the scripted eval (no model). Exit code: 0 all passed, 1 a case failed, 2 usage error; nonzero fails the job.
      # A temp HOME so nothing reads or writes the runner's ~/.elisa.
      - name: Eval (fake suite)
        run: |
          mkdir -p "$RUNNER_TEMP/evalhome"
          HOME="$RUNNER_TEMP/evalhome" target/release/elisa eval --suite fake --no-history

  app:
    name: app (Swift)
    runs-on: macos-26 # arm64
    timeout-minutes: 30
    env:
      # the Xcode the app is developed with (swift-tools-version 5.10, macOS 14 target, macOS 15 SDK APIs)
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Build ElisaApp
        working-directory: app/ElisaApp
        run: swift build -c release

      - name: Build ElisaCompanion
        working-directory: app/ElisaCompanion
        run: swift build -c release

  licenses:
    name: licenses (cargo-deny)
    # licence metadata does not depend on the host (deny.toml checks the macOS targets): a cheap Linux runner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-deny reads the dependency graph through `cargo metadata`
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master, 2026-11)
        with:
          toolchain: stable

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2

      # run from elisa/: cargo-deny reads ./deny.toml there by default (0.20 takes no --config after `check`)
      - name: Licences (elisa)
        working-directory: elisa
        run: cargo deny --manifest-path Cargo.toml --locked check licenses

      - name: Licences (mem)
        working-directory: elisa
        run: cargo deny --manifest-path mem/Cargo.toml --locked check licenses
