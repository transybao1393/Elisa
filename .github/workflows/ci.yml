# CI for Elisa: linting only (clippy on the Rust core and mem) and a licence guard, on every push to main and PR. No builds, tests or app builds:
# those run locally. Clippy runs on macOS because the core has macOS-only code (Seatbelt / sandbox-exec).
# Actions are pinned to full commit SHAs (version in the comment); update them deliberately, not by tag drift.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# one run per branch or PR: a newer push cancels the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: lint (clippy)
    runs-on: macos-26 # arm64
    timeout-minutes: 20
    defaults:
      run:
        working-directory: elisa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master, 2026-11)
        with:
          # pinned to the version used locally, so new lints arrive only when we update it
          toolchain: 1.97.1
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            elisa -> target
            elisa/mem -> target

      # a check, not a build: clippy type-checks every target (lib, bins, tests) without producing release binaries
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Clippy (mem)
        working-directory: elisa/mem
        run: cargo clippy --all-targets --locked -- -D warnings

  licenses:
    name: licenses (cargo-deny)
    # licence metadata does not depend on the host (deny.toml checks the macOS targets): a cheap Linux runner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-deny reads the dependency graph through `cargo metadata`
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master, 2026-11)
        with:
          toolchain: stable

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2

      # run from elisa/: cargo-deny reads ./deny.toml there by default (0.20 takes no --config after `check`)
      - name: Licences (elisa)
        working-directory: elisa
        run: cargo deny --manifest-path Cargo.toml --locked check licenses

      - name: Licences (mem)
        working-directory: elisa
        run: cargo deny --manifest-path mem/Cargo.toml --locked check licenses
