<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Elisa companion page. The Swift side fills the three markers below with the brand kit's own files (read at launch
     from elisa/design, v2 overlay over v1): the renderer scripts and colors.json + layout.json. Nothing is fetched. -->
<style>
  /* fonts: Silkscreen + Chivo Mono if installed on this Mac, else the system monospace (nothing is downloaded) */
  :root { --bg2: #201C29; --sep: #3F3850; --acc: #FF8FB1; --fg: #FFFFFF; --fg2: #A9A2B6; --sel: rgba(255,143,177,.15); }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%;
    -webkit-user-select: none; user-select: none; cursor: default; }
  #wrap { position: absolute; right: 16px; bottom: 6px; display: flex; flex-direction: column; align-items: flex-end; }
  #bubble { position: relative; display: flex; align-items: baseline; white-space: nowrap; overflow: visible;
    background: var(--bg2); border: 1px solid var(--sep); visibility: hidden; }
  #verb { font-family: 'Silkscreen', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 10px; letter-spacing: .06em; }
  #target { font-family: 'Chivo Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11.5px; color: var(--fg2);
    overflow: hidden; text-overflow: ellipsis; }
  #tail { position: absolute; bottom: -6px; width: 10px; height: 10px; background: var(--bg2);
    border-right: 1px solid var(--sep); border-bottom: 1px solid var(--sep); transform: rotate(45deg); }
  #row { display: flex; align-items: flex-end; gap: 6px; }
  #tray { display: flex; flex-direction: column; }
  #tray button { display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;
    background: var(--bg2); color: var(--fg2); border: 1px solid var(--sep); outline: none; }
  #tray button:hover, #tray button.on { border-color: var(--acc); color: var(--acc); }
  #stage { position: relative; cursor: pointer; }
  #glow { position: absolute; left: 8%; right: 8%; top: 18%; bottom: 4%; border-radius: 50%; transition: opacity .3s; }
  #char { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bubble"><span id="verb"></span><span id="target"></span><span id="tail"></span></div>
  <div id="row">
    <div id="tray">
      <!-- the three tray icons are the kit prototype's own (08-source/Elisa Prototype.dc.html, care tray) -->
      <button data-care="water" title="Give water"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M10 2h4v3h-4z"></path><path d="M9 5h6l1 3v12a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V8z"></path><path d="M8.5 13h7" stroke-opacity=".6"></path></svg></button>
      <button data-care="food" title="Give food"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 9h16l-1.5 11h-13z"></path><path d="M4 9l-1-3 6 1M20 9l1-3-6 1"></path><circle cx="10" cy="7.5" r="1.2"></circle><circle cx="14" cy="7.5" r="1.2"></circle></svg></button>
      <button data-care="toy" title="Give a toy"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M6 8c3 1 6 4 8 9M5 13c3 0 6 2 7 5M9 4.5c2 2 5 3 9 3"></path><path d="M17 16c2 1 3 3 5 3"></path></svg></button>
    </div>
    <div id="stage" title="Poke Elisa"><div id="glow"></div><div id="char"></div></div>
  </div>
</div>
<script>/*@KIT_CHARACTER@*/</script>
<script>/*@KIT_SHADE@*/</script>
<script>window.KIT = /*@KIT_DATA@*/;</script>
<script>
(function () {
  const K = window.KIT, L = K.layout.companion, B = L.bubble, TR = L.careTray;
  const EC = window.ElisaShade;
  const $ = id => document.getElementById(id);
  const post = m => { try { window.webkit.messageHandlers.companion.postMessage(m); } catch (e) {} };
  // the prototype's attention-pop set (state-mapping.md "Attention pop": yes) and its care durations / bubble copy
  const BIG = new Set(['celebrating', 'greeting', 'permission', 'confused', 'error', 'waking', 'poked', 'playing']);
  const WORD = { poked: 'HEY!', drinking: 'GLUG', eating: 'NOM NOM', playing: 'PLAY', greeting: 'HI!' };
  const CARE = { poke: ['poked', 'that tickles', 1400], water: ['drinking', 'water', 4800], food: ['eating', 'snack', 4800], toy: ['playing', 'yarn ball', 6000] };
  const size = K.size || L.sizes.Medium;
  const scale = L.attentionScale, spring = L.spring, [sp, sm] = [spring.replace(/\s+\d+ms$/, ''), parseInt(spring.match(/(\d+)ms/)[1], 10)];

  const hexA = (hex, a) => { const h = hex.replace('#', ''); const n = parseInt(h, 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
  let T = null, themeName = '';
  function setTheme(name) {
    name = name === 'light' ? 'light' : 'dark';
    if (name === themeName) return;
    themeName = name; T = Object.assign({ dark: name === 'dark' }, K.colors[name]);
    const r = document.documentElement.style;
    r.setProperty('--bg2', T.bg2); r.setProperty('--sep', T.separator); r.setProperty('--acc', T.accent);
    r.setProperty('--fg', T.fg); r.setProperty('--fg2', T.textMuted); r.setProperty('--sel', T.selection);
  }

  // static geometry from layout.json
  const stage = $('stage'), bubble = $('bubble'), tail = $('tail'), tray = $('tray');
  stage.style.width = stage.style.height = size + 'px';
  stage.style.transformOrigin = L.transformOrigin;
  stage.style.transition = `transform ${sm}ms ${sp}`;
  bubble.style.padding = B.padding.map(v => v + 'px').join(' ');
  bubble.style.borderRadius = B.radius + 'px';
  bubble.style.gap = B.gap + 'px';
  bubble.style.maxWidth = (size + 120) + 'px';
  bubble.style.marginRight = Math.round(size * .18) + 'px';
  bubble.style.transition = `transform .25s ${sp}, border-color .2s`;
  $('target').style.maxWidth = (size + 40) + 'px';
  tail.style.right = Math.round(size * .32) + 'px';
  tray.style.gap = TR.button.gap + 'px';
  tray.style.paddingBottom = TR.paddingBottom + 'px';
  for (const b of tray.querySelectorAll('button')) { b.style.width = b.style.height = TR.button.size + 'px'; b.style.borderRadius = TR.button.radius + 'px'; }

  // what Elisa says (or the standalone default), and a local care flash when no Elisa is connected
  let base = { state: 'greeting', verb: 'HI!', target: 'ready when you are', tone: 'accent', pop: true };
  let flash = null, shown = '', t0 = performance.now(), connected = false;
  setTheme('dark');
  setTimeout(() => { if (!connected && base.state === 'greeting') base = { state: 'idle', verb: '', target: '', tone: 'accent', pop: false }; }, 2200);

  function cur() {
    if (flash && performance.now() > flash.until) flash = null;
    return flash ? flash.m : base;
  }
  function chrome(m) {
    const st = m.state, big = !!m.pop;
    const verb = m.verb || '';
    bubble.style.visibility = verb ? 'visible' : 'hidden';
    $('verb').textContent = verb;
    $('verb').style.color = m.tone === 'error' ? T.error : m.tone === 'warn' ? T.warn : T.accent;
    // a no-break space: a plain leading space collapses inside the flex row
    $('target').textContent = m.target ? ' ' + m.target : '';
    const bc = big ? T.accent : T.separator;
    bubble.style.borderColor = bc; tail.style.borderRightColor = bc; tail.style.borderBottomColor = bc;
    bubble.style.boxShadow = big ? `0 0 0 3px ${T.selection}` : 'none';
    bubble.style.transform = `translateY(${big ? B.liftOnAttention : 0}px)`;
    stage.style.transform = `scale(${big ? scale : 1})`;
    const g = $('glow');
    const gc = st === 'error' ? hexA(T.error, .28) : st === 'permission' ? hexA(T.warn, .26) : hexA(T.accent, T.dark ? .24 : .16);
    g.style.background = `radial-gradient(closest-side, ${gc}, transparent)`;
    g.style.opacity = big ? 1 : (st === 'idle' || st === 'sleeping') ? 0 : .5;
    const care = { drinking: 'water', eating: 'food', playing: 'toy' }[st];
    for (const b of tray.querySelectorAll('button')) b.classList.toggle('on', b.dataset.care === care);
  }

  // one frame: the kit's renderer, same call as the prototype's dock (full build, props on)
  function frame(now) {
    const m = cur();
    const key = m.state + '|' + m.verb + '|' + m.target + '|' + m.tone + '|' + m.pop + '|' + themeName;
    if (key !== shown) { if (shown.split('|')[0] !== m.state) t0 = now; shown = key; chrome(m); }
    const st = EC.STATES[m.state] ? m.state : 'idle';
    $('char').innerHTML = EC.svg(st, (now - t0) / EC.STATES[st].dur, { size, detail: 'full' });
  }
  function loop(now) { frame(now); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);

  // clicks: Shade = poke, tray = water / food / toy. A press that moved (a window drag) is not a click.
  let down = null;
  document.addEventListener('mousedown', e => { down = [e.screenX, e.screenY]; });
  const moved = e => down && Math.hypot(e.screenX - down[0], e.screenY - down[1]) > 4;
  stage.addEventListener('click', e => { if (!moved(e)) post({ type: 'care', action: 'poke' }); });
  for (const b of tray.querySelectorAll('button')) b.addEventListener('click', e => { e.stopPropagation(); if (!moved(e)) post({ type: 'care', action: b.dataset.care }); });

  // the clickable areas, for click-through everywhere else (the window is transparent)
  setInterval(() => {
    const r = el => { const b = el.getBoundingClientRect(); return [b.left, b.top, b.width, b.height]; };
    post({ type: 'hit', rects: [r(stage), r(tray)].concat(bubble.style.visibility === 'visible' ? [r(bubble)] : []) });
  }, 150);

  window.companion = {
    // a state line from Elisa: {state, verb, target, tone, pop, theme}
    apply(m) { if (m.theme) setTheme(m.theme); flash = null; base = { state: m.state, verb: m.verb || '', target: m.target || '', tone: m.tone || 'accent', pop: !!m.pop }; },
    connected(on) { connected = on; if (!on) { flash = null; base = { state: 'sleeping', verb: '', target: '', tone: 'accent', pop: false }; } },
    // no Elisa connected: play the care action here (the prototype's durations and bubble copy)
    localCare(action) {
      const c = CARE[action]; if (!c) return;
      if (base.state === 'sleeping') base = { state: 'idle', verb: '', target: '', tone: 'accent', pop: false };
      flash = { m: { state: c[0], verb: WORD[c[0]], target: c[1], tone: 'accent', pop: BIG.has(c[0]) }, until: performance.now() + c[2] };
    },
    state() { return cur().state; },
    // snapshots only: the theme window background behind Shade (the real window is transparent)
    backdrop(on) { document.body.style.background = on ? T.bg : 'transparent'; }
  };
  post({ type: 'ready' });
})();
</script>
</body>
</html>
